[package]
name = "dtar"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Create deterministic .tar.gz archives"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
globset = "0.4"
indicatif = "0.17"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
